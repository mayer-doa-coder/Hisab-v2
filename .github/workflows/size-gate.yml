name: APK size gate

on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'package-lock.json']

env:
  # The budget. Raising this number requires an entry in docs/DECISIONS.md
  # explaining what was bought and why it was worth it.
  LIMIT_MB: 25

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - run: npm ci
      - name: Build release APK (arm64-v8a, per-ABI split)
        run: npm run build:apk

      - name: Enforce budget
        run: |
          APK=$(find . -name "*arm64-v8a*release*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::no APK produced"; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          LIMIT=$(( LIMIT_MB * 1024 * 1024 ))
          MB=$(( SIZE / 1024 / 1024 ))
          echo "APK: ${MB} MB  |  Limit: ${LIMIT_MB} MB"
          echo "### APK size: ${MB} MB / ${LIMIT_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::APK budget exceeded (${MB} MB > ${LIMIT_MB} MB). See AGENTS.md §3.4."
            exit 1
          fi
