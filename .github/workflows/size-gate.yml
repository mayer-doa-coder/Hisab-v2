name: APK size gate

on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', 'package-lock.json', '.github/workflows/size-gate.yml']

env:
  # The budget. Raising this number requires an entry in docs/DECISIONS.md
  # explaining what was bought and why it was worth it.
  LIMIT_MB: 25

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - run: npm ci
      - name: Build release APK (arm64-v8a only, via expo-build-properties buildArchs)
        run: npm run build:apk

      - name: Enforce budget
        run: |
          # Filename no longer encodes the ABI — see scripts/size-check.js's
          # comment. The single output is named app-release.apk; the ABI
          # restriction is enforced by app.json's expo-build-properties
          # config (buildArchs), verified by unzipping and checking lib/.
          MATCHES=$(find . -name "*release*.apk" -not -path "*/node_modules/*")
          COUNT=$(echo "$MATCHES" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "::error::no APK produced"; exit 1; fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::ambiguous — multiple matching APKs found:"
            echo "$MATCHES"
            exit 1
          fi
          APK="$MATCHES"
          SIZE=$(stat -c%s "$APK")
          LIMIT=$(( LIMIT_MB * 1024 * 1024 ))
          MB=$(( SIZE / 1024 / 1024 ))
          echo "APK: ${MB} MB  |  Limit: ${LIMIT_MB} MB"
          echo "### APK size: ${MB} MB / ${LIMIT_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::APK budget exceeded (${MB} MB > ${LIMIT_MB} MB). See AGENTS.md §3.4."
            exit 1
          fi
